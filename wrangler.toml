name = "study-short-cut"
main = "worker.js"
compatibility_date = "2026-07-23"

# schools.txt 를 문자열로 import 한다 (import SCHOOLS_RAW from './schools.txt')
[[rules]]
type = "Text"
globs = ["**/*.txt"]

# public/ 안의 파일은 사이트 루트 기준으로 그대로 서빙된다 (public/og.png → /og.png).
# 자산에 없는 주소는 워커가 처리한다. 캐시 규칙은 public/_headers.
[assets]
directory = "./public/"

# 커스텀 도메인 — 도메인이 같은 Cloudflare 계정에 있으면 배포 때 자동으로 연결된다.
routes = [
  { pattern = "study-short-cut.com", custom_domain = true },
  { pattern = "www.study-short-cut.com", custom_domain = true },
]

# 매일 한국시간 12:00 에 사이트맵 주소 일부를 IndexNow 로 제출 (worker.js 의 scheduled)
[triggers]
crons = ["0 3 * * *"]

# 상담 신청 이메일 알림 (Cloudflare Email Routing)
# 준비: 대시보드 > 도메인 > Email Routing 활성화 > Destination addresses 에 아래 주소 추가·인증
[[send_email]]
name = "NOTIFY"
destination_address = "hhhyunee3@naver.com"

# 환경변수(대시보드 > 워커 > Settings > Variables and Secrets, Secret 타입 권장):
#   NAVER_VERIFY  네이버 서치어드바이저 소유확인 메타 값
#   GOOGLE_VERIFY 구글 서치콘솔 소유확인 메타 값
#   DAUM_PIN      다음 웹마스터도구 PIN (robots.txt 에 기록)
#   SHEET_WEBHOOK_URL 구글 시트 Apps Script 웹앱 URL
#   NOTIFY_TO / NOTIFY_FROM 알림 메일 수신·발신 주소 (없으면 site.js 값)
